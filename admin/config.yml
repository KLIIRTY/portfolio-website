backend:
  name: github
  repo: KLIIRTY/portfolio-website   # your GitHub repo
  branch: main                       # branch to commit to
  auth_scope: repo                   # required for private repos, optional for public

media_folder: "assets/images"       # folder for uploaded images
public_folder: "/assets/images"

collections:
  - name: "projects"
    label: "Projects"
    folder: "projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Tech", name: "tech", widget: "string" }
      - { label: "GitHub Link", name: "github", widget: "string" }
      - { label: "Demo Link", name: "demo", widget: "string" }
